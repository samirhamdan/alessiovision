name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alessio
          POSTGRES_PASSWORD: alessio
          POSTGRES_DB: alessio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alessio -d alessio_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      ALESSIO_TEST_DATABASE_URL: postgresql+psycopg://alessio:alessio@localhost:5432/alessio_test
      ALESSIO_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
