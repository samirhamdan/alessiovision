[project]
name = "alessio-contracts"
version = "0.1.0"
description = "Protocolo versionado entre o Agente ALESSIO e a plataforma na nuvem."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "tzdata>=2024.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alessio_contracts"]
